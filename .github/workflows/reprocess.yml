name: Reprocess
on:
  workflow_dispatch: {}
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python capture.py
        env:
          REPROCESS: "1"
          TAS_NOTION_TOKEN: ${{ secrets.TAS_NOTION_TOKEN }}
