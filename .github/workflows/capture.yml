name: Capture URL
on:
  repository_dispatch:
    types: [capture-url]
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python capture.py
        env:
          CAPTURE_URL: ${{ github.event.client_payload.url }}
          NOTION_TOKEN: ${{ secrets.TAS_NOTION_TOKEN }}
