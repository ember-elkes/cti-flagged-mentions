name: Check actors.json drift
on:
  schedule:
    - cron: "30 8 * * 5"   # weekly on Fridays at 0830
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python generate_actors.py
        env:
          TAS_NOTION_TOKEN: ${{ secrets.TAS_NOTION_TOKEN }}
          ACTORS_FILE: actors_generated.json
        
       -run: git diff --no-index --exit-code actors.json actors_generated.json